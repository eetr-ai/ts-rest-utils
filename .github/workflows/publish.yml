name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm Trusted Publishing — the workflow proves its identity to
  # the registry over OIDC, so no npm token is stored in this repository.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing needs npm >= 11.5.1, which is newer than the version
      # bundled with the Node runtime. Pinned rather than "latest": this job
      # holds the publish credential, so it should be reproducible.
      - run: npm install -g npm@11.18.0
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
