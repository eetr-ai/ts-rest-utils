name: publish

on:
  # Called from release-please.yml in the same run that cuts the release.
  # A release created with the built-in GITHUB_TOKEN does not raise
  # `release.published`, so a separate `on: release` trigger would never fire.
  workflow_call:
    inputs:
      ref:
        description: Tag to publish from
        required: true
        type: string
  # Manual re-run, for a release that needs publishing again.
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to publish (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Installing and building runs arbitrary code from the dependency tree —
  # lifecycle scripts, the bundler, its plugins. That happens here, in a job
  # with no privileged token to steal.
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Require a release tag
        # Only tags are publishable. A branch is mutable and can carry
        # unreviewed commits. The ref goes through the environment rather than
        # being interpolated into the script, so it cannot be read as shell.
        env:
          REF: ${{ inputs.ref }}
        run: |
          case "$REF" in
            refs/tags/v*|v*) echo "publishing from $REF" ;;
            *) echo "refusing to publish from '$REF': not a release tag"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve the exact commit
        id: resolve
        # The publish job checks out this SHA rather than resolving the tag a
        # second time, so dist/ and the package.json version cannot come from
        # different commits.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache anywhere in this workflow. This job's output is
          # the artifact that gets published, so a poisoned cache entry would
          # reach the registry even though the job holds no credential.
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    # Somewhere to attach required reviewers or a tag policy to the only job
    # that can reach the registry.
    environment: npm-publish
    permissions:
      contents: read
      # npm Trusted Publishing: the workflow proves its identity over OIDC, so
      # no npm token is stored here. Scoped to this job, which never runs
      # `npm ci` — the only code it executes is the npm CLI itself.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # Trusted Publishing needs npm >= 11.5.1, newer than the version bundled
      # with the Node runtime. Pinned rather than `latest`: this job holds the
      # publish credential, so it should be reproducible.
      - run: npm install -g npm@11.18.0
      # No `npm ci` here by design — publishing needs package.json and dist/,
      # not the dependency tree.
      - run: npm publish --provenance --access public
