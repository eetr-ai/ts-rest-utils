name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Installing and building runs arbitrary code from the dependency tree —
  # lifecycle scripts, the bundler, its plugins. That happens here, in a job
  # with no privileged token to steal.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      # Required for npm Trusted Publishing: the workflow proves its identity to
      # the registry over OIDC, so no npm token is stored in this repository.
      # Scoped to this job alone, and this job never runs `npm ci` — the only
      # code it executes is the npm CLI itself.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # Trusted Publishing needs npm >= 11.5.1, which is newer than the version
      # bundled with the Node runtime. Pinned rather than `latest`: this job
      # holds the publish credential, so it should be reproducible.
      - run: npm install -g npm@11.18.0
      # No `npm ci` here by design — publishing needs package.json and dist/,
      # not the dependency tree.
      - run: npm publish --provenance --access public
