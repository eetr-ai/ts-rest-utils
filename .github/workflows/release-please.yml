name: release-please

on:
  push:
    branches: [main]
  # Lets the release pull request be rebuilt on demand. Release Please only
  # rewrites its branch when the release contents change, so a fix that does not
  # appear in the changelog leaves an existing release pull request stale.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Release Please creates and applies its own `autorelease: *` labels, and
  # label management sits under the issues permission.
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishing runs here, in the same run that cut the release, rather than from
  # an `on: release` trigger. A release created with the built-in GITHUB_TOKEN
  # deliberately does not cascade into further workflow runs, so a separate
  # trigger would simply never fire.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # A called workflow's token is capped by the calling job's, and the cap is
    # checked before any job is scheduled — so a scope missing here fails the
    # whole run at startup rather than only the job that needed it.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
