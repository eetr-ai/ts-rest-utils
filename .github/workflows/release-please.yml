name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Release Please creates and applies its own `autorelease: *` labels, and
  # label management sits under the issues permission.
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # GITHUB_TOKEN deliberately does not trigger further workflows, so a
          # release it publishes would never start publish.yml, and a release
          # pull request it opens would never get the CI checks that branch
          # protection requires. RELEASE_PLEASE_TOKEN — a fine-grained PAT with
          # contents/pull-requests/issues write — lifts both restrictions.
          # The fallback keeps this workflow working before that secret exists;
          # releases then need to be published by hand to start publish.yml.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
